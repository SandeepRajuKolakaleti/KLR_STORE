<div class="page-content pt-150 pb-150">
    <div class="container">
        <div class="row">
            <div class="col-xl-8 col-lg-10 col-md-12 m-auto">
                <div class="row">
                    <div class="col-lg-6 col-md-8">
                        <div class="login_wrap widget-taber-content background-white">
                            <div class="padding_eight_all bg-white">
                                <div class="heading_s1">
                                    <h1 class="mb-5">Forgot Password</h1>
                                    <p class="mb-30">Already remember an account? <a (click)="login()" href="javascript:void(0)">Login</a></p>
                                </div>
                                <form method="post" [formGroup]="forgotForm">
                                    <div class="form-group">
                                        <input formControlName="email" type="text" required="" name="email" placeholder="Email" />
                                    </div>
                                    <div class="form-group">
                                        <input formControlName="password" required="" type="password" name="password" placeholder="Password" />
                                    </div>
                                    <div class="form-group">
                                        <input formControlName="confirmPassword" required="" type="password" name="confirm password" placeholder="Confirm password" />
                                    </div>
                                    <div class="form-group mb-30">
                                        <button (click)="submit()" [disabled]="forgotForm.invalid" class="btn btn-fill-out btn-block hover-up font-weight-bold" name="reset">Submit &amp; Reset</button>
                                    </div>
                                    <p class="font-xs text-muted"><strong>Note:</strong>Your personal data will be used to support your experience throughout this website, to manage access to your account, and for other purposes described in our privacy policy</p>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
